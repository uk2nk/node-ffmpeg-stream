<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>node-ffmpeg-stream demo</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1d2129;
      --muted: #5f6673;
      --border: #dfe2e7;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --danger: #dc2626;
      --ok: #16a34a;
      --warn: #d97706;
      --screen: #0b0d10;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.05), 0 8px 24px rgb(0 0 0 / 0.06);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --card: #171a21;
        --text: #e6e8ec;
        --muted: #9aa1ad;
        --border: #2a2f39;
        --accent: #3b82f6;
        --accent-hover: #60a5fa;
        --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 8px 24px rgb(0 0 0 / 0.3);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    main {
      max-width: 880px;
      margin: 0 auto;
      padding: 2.5rem 1rem 3rem;
    }

    header { margin-bottom: 1.5rem; }

    h1 {
      margin: 0 0 0.25rem;
      font-size: 1.6rem;
      letter-spacing: -0.01em;
    }

    header p {
      margin: 0;
      color: var(--muted);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 1.25rem;
    }

    label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    input {
      flex: 1 1 16rem;
      min-width: 0;
      padding: 0.65rem 0.8rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font: 0.95rem ui-monospace, "Cascadia Code", Consolas, monospace;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgb(37 99 235 / 0.2);
    }

    button {
      padding: 0.65rem 1.2rem;
      border: 1px solid transparent;
      border-radius: 8px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, opacity 0.15s;
    }

    button[type="submit"] {
      background: var(--accent);
      color: #fff;
    }

    button[type="submit"]:hover:not(:disabled) { background: var(--accent-hover); }

    #disconnect {
      background: transparent;
      border-color: var(--border);
      color: var(--text);
    }

    #disconnect:hover:not(:disabled) {
      border-color: var(--danger);
      color: var(--danger);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    #status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-height: 1.5rem;
      margin: 1rem 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    #status::before {
      content: "";
      flex: none;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--muted);
    }

    #status[data-state="connecting"]::before {
      background: var(--warn);
      animation: pulse 1s ease-in-out infinite;
    }

    #status[data-state="live"]::before { background: var(--ok); }
    #status[data-state="error"]::before { background: var(--danger); }

    .screen {
      position: relative;
      margin-top: 1rem;
      aspect-ratio: 16 / 9;
      border-radius: 10px;
      overflow: hidden;
      background: var(--screen);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .placeholder {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #6b7280;
      font-size: 0.95rem;
      pointer-events: none;
    }

    .live-badge {
      position: absolute;
      top: 0.75rem;
      left: 0.75rem;
      display: none;
      align-items: center;
      gap: 0.35rem;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      background: var(--danger);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .live-badge::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
      animation: pulse 1.4s ease-in-out infinite;
    }

    .screen[data-state="live"] .live-badge { display: inline-flex; }
    .screen[data-state="live"] .placeholder { display: none; }

    @keyframes pulse {
      50% { opacity: 0.35; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>node-ffmpeg-stream demo</h1>
      <p>Connect to a running node-ffmpeg-stream WebSocket server.</p>
    </header>

    <section class="card">
      <form id="connection-form">
        <label for="websocket-url">WebSocket URL</label>
        <div class="controls">
          <input
            id="websocket-url"
            name="websocket-url"
            type="url"
            value="ws://localhost:7070"
            required
            spellcheck="false"
          >
          <button type="submit">Connect</button>
          <button id="disconnect" type="button" disabled>Disconnect</button>
        </div>
      </form>

      <p id="status" role="status" aria-live="polite" data-state="idle">Disconnected.</p>

      <div class="screen" id="screen" data-state="idle">
        <canvas id="video" aria-label="Live camera stream"></canvas>
        <div class="placeholder">No stream connected</div>
        <span class="live-badge">LIVE</span>
      </div>
    </section>
  </main>

  <script src="jsmpeg.min.js"></script>
  <script src="client.js"></script>
</body>
</html>
